[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kafka-file-head-analyzer"
version = "0.1.0"
description = "Consume Kafka material events, probe file headers, and export size/content reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4.0",
    "aiokafka>=0.11,<1.0",
    "matplotlib>=3.9,<4.0",
    "numpy>=2.1,<3.0",
    "pandas>=2.2,<3.0",
    "python-magic>=0.4.27,<1.0; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14,<1.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pandas-stubs>=2.2,<3.0",
    "ruff>=0.11",
    "pyright>=1.1",
]

[project.scripts]
kafka-file-head-analyzer = "kafka_file_head_analyzer_old:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["kafka_file_head_analyzer_old.py"]
